name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install only the deps needed for lint + tests.
      # crewai and langchain are excluded — heavy install, not needed for CI.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            mcp>=1.0.0 \
            httpx>=0.27.0 \
            pydantic>=2.6.0 \
            python-dotenv>=1.0.0 \
            pyjwt>=2.8.0 \
            cryptography>=42.0.0 \
            openai>=1.30.0
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check ehr_mcp/ main.py

      - name: Format check (black)
        run: black --check ehr_mcp/ main.py

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          SMART_TOKEN_URL: https://mock-token-url.example.com/token
          SMART_CLIENT_ID: mock-client-id
          SMART_PRIVATE_KEY_PATH: ./keys/private_key.pem
          FHIR_BASE_URL: https://mock-fhir.example.com/api/FHIR/R4
          MCP_SERVER_NAME: ehr-mcp
          MCP_SERVER_VERSION: 0.1.0
